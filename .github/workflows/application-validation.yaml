name: Campus Event Manager Validation  
on: 
    push:
        branches:
        - main
    pull_request:
        types: [ opened, closed, synchronize ]
        branches:
        - main
    workflow_dispatch:
jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                node-version: '24.x'
            - name: Files list
              run: ls
            - name: Install Dependencies
              run: npm ci
            - name: Run Unit Tests
              run: npm test
    
    validate-application :
        name: Validate Application
        runs-on: ubuntu-latest
        steps:
            - run: 'echo "Workflow triggered by: ${{ github.event_name }}"'
        